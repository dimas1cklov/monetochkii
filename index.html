<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1450ff">
<title>Coin Chest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b2fc4;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:linear-gradient(180deg,#2f6bff,#1450ff 45%,#0b3df5)}
#app.framed{border-radius:60px;box-shadow:0 30px 120px rgba(0,0,0,.5)}
.a{position:absolute}
#card{left:48px;top:70px;width:984px;height:300px;border-radius:40px;z-index:5;background:linear-gradient(135deg,#23242f,#15161d 60%,#1b1c26);box-shadow:0 20px 50px rgba(0,0,0,.35);transition:transform .15s}
#card.pulse{transform:scale(1.03)}
#card .lbl{position:absolute;left:52px;top:44px;color:#a9abb8;font-size:36px;font-weight:600}
#card .tot{position:absolute;left:52px;top:96px;display:flex;align-items:center;gap:18px;color:#fff;font-size:92px;font-weight:800;letter-spacing:-2px}
#card .tot img{width:76px;height:76px}
#card .row{position:absolute;left:52px;right:52px;top:220px;display:flex;justify-content:space-between;color:#d7d8e0;font-size:32px;font-weight:600}
#card .row .g{color:#8d8f9c}
#game{inset:0;touch-action:none}
#fx{left:0;top:0;width:1080px;pointer-events:none}
#chest{width:230px;height:218px;left:0;top:0;z-index:3;pointer-events:none}
.coin{width:180px;height:180px;left:0;top:0;z-index:4;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,60,.35))}
.plus{color:#fff;font-weight:900;font-size:66px;white-space:nowrap;pointer-events:none;z-index:6;text-shadow:0 6px 0 rgba(0,0,40,.35),0 0 24px rgba(255,220,80,.8);animation:rise .8s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}25%{transform:translate(-50%,-80%) scale(1.15)}100%{transform:translate(-50%,-230%);opacity:0}}
#hint{left:0;width:1080px;text-align:center;color:#fff;font-size:46px;font-weight:700;pointer-events:none;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.5}}
#dim{inset:0;z-index:8;background:rgba(0,10,60,.4);opacity:0;pointer-events:none;transition:opacity .3s}
#modal{left:110px;width:860px;height:600px;z-index:9;border-radius:44px;background:#f0f4ff;box-shadow:0 30px 80px rgba(0,0,0,.3);opacity:0;pointer-events:none;transform:scale(.85);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
#dim.on,#modal.on{opacity:1;pointer-events:auto}
#modal.on{transform:scale(1)}
#modal h2{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:56px;color:#2a2c3a}
#modal p{position:absolute;left:0;right:0;top:146px;text-align:center;font-size:32px;color:#8a8fa3}
#x{position:absolute;right:30px;top:30px;width:80px;height:80px;border-radius:40px;background:#e2e7f5;color:#6b7186;font-size:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#user{position:absolute;left:60px;width:740px;top:230px;height:120px;border-radius:24px;border:3px solid #c9d3ee;background:#fff;outline:none;font:500 46px Inter,-apple-system,sans-serif;color:#20222e;padding:0 32px;-webkit-user-select:text;user-select:text}
#user:focus{border-color:#2f6bff}
#user.err{animation:shake .4s;border-color:#ff4d6d}
@keyframes shake{25%,75%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
#go{position:absolute;left:60px;width:740px;top:400px;height:128px;border-radius:64px;border:0;cursor:pointer;background:linear-gradient(90deg,#43b9ff,#1f6bff);color:#fff;font:700 50px Inter,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;gap:20px}
.spin{width:52px;height:52px;border-radius:50%;border:7px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#win{inset:0;z-index:7;opacity:0;pointer-events:none;transition:opacity .4s;background:linear-gradient(180deg,#8adcff,#4fc3fb 50%,#2fa8f5)}
#win.on{opacity:1;pointer-events:auto}
#win .in{position:absolute;left:0;right:0;text-align:center}
#win h1{font-size:112px;font-weight:900;color:#1450ff;letter-spacing:-2px;text-shadow:0 6px 0 rgba(255,255,255,.6)}
#win .sub{margin-top:30px;font-size:46px;color:#1a62d9;font-weight:600}
#win .usr{margin-top:12px;font-size:60px;color:#0b3df5;font-weight:800;word-break:break-all;padding:0 60px}
#win .amt{margin-top:50px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:124px;font-weight:900;color:#fff;text-shadow:0 8px 0 rgba(10,60,200,.35)}
#win .amt img{width:130px;height:130px}
#again{margin:70px auto 0;width:420px;height:124px;border-radius:62px;background:#f3d7ff;color:#5b2d8a;font-size:48px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(90,40,140,.25);cursor:pointer}
</style>
</head>
<body>
<div id="app">
 <div id="card" class="a">
  <div class="lbl">Coins</div>
  <div class="tot"><img class="ci" alt=""><span id="total">0</span></div>
  <div class="row"><span>LIVE rewards</span><span class="g">Others</span><span>Coins ›</span></div>
 </div>
 <div id="game" class="a">
  <canvas id="fx" class="a" width="1080" height="1920"></canvas>
  <div id="hint" class="a">Drag to fly &amp; collect coins!</div>
  <img id="chest" class="a" alt="">
 </div>
 <div id="win" class="a">
  <div class="in" id="winIn">
   <h1>Congratulations!</h1>
   <div class="sub">Coins added for</div>
   <div class="usr" id="wUser"></div>
   <div class="amt"><img class="ci" alt=""><span id="wAmt">+0</span></div>
   <div id="again">Play Again</div>
  </div>
 </div>
 <div id="dim" class="a"></div>
 <div id="modal" class="a">
  <div id="x">✕</div>
  <h2>Enter Username</h2>
  <p>Enter your username to receive coins</p>
  <input id="user" type="text" placeholder="Username" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24">
  <button id="go">Proceed</button>
 </div>
</div>

var GOAL=6, POOL=[350,400,250,277,300,420,303,333,375,280,450,222,365,290];
var W=1080, H=1920, CW=230, CH=218, CX=230;
var app=document.getElementById('app');
function $(id){return document.getElementById(id)}
document.querySelectorAll('.ci').forEach(function(i){i.src=COIN});

/* fit to screen */
var typing=false;
function fit(){
 if(typing)return;
 var vv=window.visualViewport, vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
 var s=vw/W, h=vh/s, framed=false;
 if(h<1700){framed=vw>vh*0.75;H=1920;s=Math.min(vh*(framed?0.96:1)/H,vw/W);}else H=Math.round(h);
 app.style.height=H+'px';
 app.style.transform='translate('+(vw-W*s)/2+'px,'+(vh-H*s)/2+'px) scale('+s+')';
 app.classList.toggle('framed',framed);
 $('fx').height=H;$('fx').style.height=H+'px';
 $('hint').style.top=(H-260)+'px';
 $('modal').style.top=Math.max(480,Math.round(H*0.33))+'px';
 $('winIn').style.top=Math.round(560+(H-1920)*0.4)+'px';
}
addEventListener('resize',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);

});

function rnd(a,b){return a+Math.random()*(b-a)}
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function top0(){return 460}
function bot0(){return H-200}

/* control */
function appY(e){var r=app.getBoundingClientRect();return (e.clientY-r.top)/(r.height/H)}
game.addEventListener('pointerdown',function(e){if(phase!=='play')return;dragging=moved=true;ty=appY(e)-CH/2;try{game.setPointerCapture(e.pointerId)}catch(_){}});
game.addEventListener('pointermove',function(e){if(dragging&&phase==='play')ty=appY(e)-CH/2});
addEventListener('pointerup',function(){dragging=false});
addEventListener('pointercancel',function(){dragging=false});

}

}
